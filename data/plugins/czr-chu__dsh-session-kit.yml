description:
  en: 'Session manager for DSH: export in full, compact or compressed form, back up and archive whole workspaces, restore deleted sessions from a reversible trash, move sessions into existing or new workspaces, compress sessions into smaller new-id copies, check attachment references, and archive/restore a whole workspace without moving its files.'
  zh: 'DSH 会话管理：全量/精简/压缩导出，工作区打包备份与整体归档/恢复，回收站恢复误删会话，迁移到已有/新建工作区，把会话压缩为更小的新 id 副本，检查附件引用是否可解析，以及不移动文件地归档/恢复整个工作区。'
